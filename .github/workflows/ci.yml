name: ci
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t chimera-gateway:ci .
      - name: image starts and answers /healthz
        run: |
          docker run -d --name gw -p 18088:8088 chimera-gateway:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:18088/healthz && exit 0; sleep 1; done
          docker logs gw
          exit 1

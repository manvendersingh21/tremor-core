# Copy to chimera.toml. No secrets here: CRUSOE_API_KEY comes from the environment or .env only.

use_pool = false              # true: SpeculativeCascadeRouter routes through [[tiers]] below

[local]                      # tier 1: llama.cpp llama-server on this machine
url = "http://127.0.0.1:8080"
chatml = true

[gpu]                        # tier 2: Ollama on the GPU box, via `ssh -L 11435:127.0.0.1:11434 <gpu-host>`
enabled = true               # false: Crusoe mid model takes this tier
url = "http://127.0.0.1:11435"
model = "qwen3:30b-instruct"

[crusoe]                     # tier 3 (and tier 2 when gpu.enabled = false)
base_url = "https://api.inference.crusoecloud.com"
mid_model = "Qwen/Qwen3.8-27B"
top_model = "openai/gpt-oss-120b"
top_template_kwargs = { reasoning_effort = "low" }

[thresholds]
semantic = 0.97              # cosine similarity for a semantic cache hit
confidence = 0.85            # local mean token probability needed to answer locally
heavy = 0.6                  # complexity score that skips the small models

[cache]
path = "~/.chimera/cache.db" # exact + semantic caches, persistent
semantic = true              # false skips the embedding model (exact cache only)
backend = "sqlite"           # "postgres": shared pgvector cache (docs/vector-store.md); sqlite stays as the fallback
dsn_env = "CHIMERA_DB_URL"   # NAME of the env var that holds the DSN. The DSN itself lives in .env only.
tenant = "default"           # rows are isolated per tenant
store_text = false           # true keeps prompt text in the shared DB (opt-in)
# ttl_s = 2592000            # row lifetime in seconds; unset = forever
top_k = 5
budget_ms = 300              # DB time per lookup before the local cache answers (150 was too tight from a laptop)

[telemetry]
path = "~/.chimera/telemetry.jsonl"   # CHIMERA_TELEMETRY overrides

[gateway]                    # apps/gateway: OpenAI-compatible service. python -m apps.gateway
db = "~/.chimera/gateway.db" # tenant logins (hashed) + audit log; CHIMERA_GATEWAY_DB overrides
rate_per_min = 120           # per login
burst = 30
max_body_bytes = 1000000
timeout_s = 90               # per backend call
log_prompts = false          # true puts prompt text in request logs
actions = false              # true enables POST /v1/actions/score

# ---- Tier pool (packages/chimera-core/tiers.py). Add hardware by adding a [[tiers]] block. ----
# Routing: cheapest enabled, healthy tier with max_complexity >= task complexity; climbs on low
# confidence, timeout or error. Owned hardware costs 0, so it sorts by max_complexity (small first).
# Speculative verify only between tiers with the same `family`. Prices: dollars per 1k tokens.
# The Crusoe credential comes from the environment or .env only.

[[tiers]]
name = "phone-3b"            # Android, Termux llama-server over `adb forward` (docs/android.md)
device = "phone"
backend = "llamacpp"
url = "http://127.0.0.1:8081"
model = "Qwen2.5-3B-Instruct-q4_k_m"
family = "qwen"
max_complexity = 0.25
timeout_s = 60
enabled = false              # until the phone is set up

[[tiers]]
name = "mac-3b"
device = "laptop"
backend = "llamacpp"
url = "http://127.0.0.1:8080"
model = "Qwen2.5-3B-Instruct-q4_k_m"
family = "qwen"
max_complexity = 0.4
timeout_s = 60

[[tiers]]
name = "gpu-small"           # V100 box, Ollama via ssh tunnel (-L 11435:127.0.0.1:11434)
device = "gpu"
backend = "ollama"
url = "http://127.0.0.1:11435"
model = "qwen3:30b-instruct"
family = "qwen"
max_complexity = 0.6
timeout_s = 180

[[tiers]]
name = "gpu-large"           # Modal H200 "The Castle": vLLM Qwen3.5-122B-A10B GPTQ-Int4 (deploy/modal/vllm_server.py)
device = "gpu"               # scales to zero; `make modal-up` / `make modal-down`. Cold start is minutes.
backend = "openai"
url = "$MODAL_VLLM_URL"      # from the environment or .env
model = "Qwen/Qwen3.5-122B-A10B-GPTQ-Int4"
family = "qwen3.5"           # vocab differs from Qwen2.5/Qwen3 (see bench/results_modal.md): no speculative verify with the Mac 3B
max_complexity = 0.85
timeout_s = 240
enabled = true
api_key_env = "MODAL_VLLM_TOKEN"
template_kwargs = { enable_thinking = false }
# Cost is GPU-seconds x $4.54/hr, billed by Modal while the container is up, so per-token prices stay 0 here.

[[tiers]]
name = "cloud-mid"
device = "cloud"
backend = "openai"
url = "https://api.inference.crusoecloud.com"
model = "Qwen/Qwen3.8-27B"
family = "qwen"
max_complexity = 0.85
cost_per_1k_in = 0.00025
cost_per_1k_out = 0.002
timeout_s = 120
template_kwargs = { enable_thinking = false }

[[tiers]]
name = "cloud-top"           # largest model on the account (checked with /v1/models)
device = "cloud"
backend = "openai"
url = "https://api.inference.crusoecloud.com"
model = "openai/gpt-oss-120b"
family = "gpt-oss"
max_complexity = 1.0
cost_per_1k_in = 0.00005
cost_per_1k_out = 0.00025
timeout_s = 180
template_kwargs = { reasoning_effort = "low" }

[[tiers]]
name = "cloud-deepseek"      # biggest Crusoe model (763B per /v1/models), thinking off
device = "cloud"
backend = "openai"
url = "https://api.inference.crusoecloud.com"
model = "deepseek-ai/DeepSeek-V4.1-Flash"
family = "deepseek"
max_complexity = 1.0
cost_per_1k_in = 0.00029
cost_per_1k_out = 0.0012
timeout_s = 240
template_kwargs = { thinking = false }

[[tiers]]
name = "cloud-coder"         # GMI Cloud Qwen3.8-Max. Qwen3-Coder-480B is listed but deprecated
device = "cloud"
backend = "openai"
url = "https://api.gmi-serving.com"
model = "Qwen/Qwen3.8-Max"
family = "qwen"
max_complexity = 1.0
cost_per_1k_in = 0.002
cost_per_1k_out = 0.006
template_kwargs = { enable_thinking = false }
timeout_s = 240
api_key_env = "GMI_API_KEY"

[[tiers]]
name = "cloud-largest"       # GMI Cloud, about 1T. Kimi K3 always thinks (thinking=false is rejected): effort low
device = "cloud"
backend = "openai"
url = "https://api.gmi-serving.com"
model = "moonshotai/kimi-k3"
family = "kimi"
max_complexity = 1.0
cost_per_1k_in = 0.003
cost_per_1k_out = 0.015
timeout_s = 300
api_key_env = "GMI_API_KEY"
template_kwargs = { reasoning_effort = "low" }

[project]
name = "chimera-core"
version = "0.1.0"
description = "Edge-to-cloud LLM cascade router: caches, local small model, GPU and cloud tiers, risk firewall."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
embed = ["sentence-transformers"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
graph = ["neo4j>=5.18"]
gateway = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest", "hypothesis>=6", "httpx", "mcp", "fastapi>=0.110", "uvicorn>=0.29"]

# shortcut: the package dir is hyphenated (packages/chimera-core) and is loaded by the root
# conftest.py shim, so nothing is installed as a module; upgrade by renaming the dir.
[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a live server or an API key; skipped by default"]
addopts = "-m 'not live'"
